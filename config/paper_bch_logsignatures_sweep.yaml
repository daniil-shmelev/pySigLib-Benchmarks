# Direct BCH log-signature sweep for the pySigLib paper.

libraries:
    - iisignature
    - signature-rs
    - log-signatures-pytorch
    - pysiglib

path_kind: "brownian"
seed: 20260529

Ns: [1000]
Ds: [2, 4, 8, 16]
Ms: [2, 3]

operations:
    - logsignature
    - logsignature_backprop

backends:
    - cpu
    - gpu

batch_size: 256
repeats: 10
warmup_iterations: 1
timing_statistic: "min"
worker_memory_limit_gb: 16
task_timeout_seconds: 120
clear_input_caches_after_task: true

library_configs:
    iisignature:
        logsig_method: "C"
    log-signatures-pytorch:
        log_signature_method: "bch_sparse"
        log_signature_mode: "hall"
    pysiglib:
        log_sig_method: 3
        backend_configs:
            cpu:
                n_jobs: -1

runs_dir: "runs"
