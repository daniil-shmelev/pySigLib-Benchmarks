# benchmark_sweep.yaml
# Complete signature-family sweep across all registered libraries.

path_kind: "brownian"
seed: 20260529

# Path lengths
Ns: [256, 512, 1024]

# Dimensions: low (fast, high-m friendly) vs high (stress test)
Ds: [2, 4, 8, 16]

# Depths: skip trivial cases, go deeper
Ms: [2, 3]

operations:
    - signature
    - logsignature
    - sig_backprop
    - branchedsignature_nonplanar
    - branchedlogsignature_nonplanar
    - branchedsignature_planar
    - branchedlogsignature_planar

# Backend labels defined per library in libraries_registry.yaml.
# Use [cpu], [gpu], or [cpu, gpu] to choose the experiment scope.
backends:
    - cpu
    - gpu

batch_size: 256

repeats: 10

logsig_method: "S"

runs_dir: "runs"
