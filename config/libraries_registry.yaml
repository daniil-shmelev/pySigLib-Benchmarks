# libraries_registry.yaml
# Registry of adapters and their dependencies

libraries:
  iisignature:
    type: python
    script: "adapters/python/run_iisignature.py"
    extras:
      - iisignature
    backend: cpu
    operations:
      - signature
      - logsignature
      - sig_backprop
      - logsignature_backprop

  signature-rs:
    type: python
    script: "adapters/python/run_signature_rs.py"
    extras:
      - signature-rs
    backend: cpu
    operations:
      - logsignature

  log-signatures-pytorch:
    type: python
    memory_framework: torch
    script: "adapters/python/run_log_signatures_pytorch.py"
    extras:
      - log-signatures-pytorch
    # This pure-Python wheel works on 3.12, but its metadata declares >=3.13.
    # The orchestrator installs only this exact verified wheel while ignoring
    # that marker.
    compatibility_wheel:
      url: "https://files.pythonhosted.org/packages/b1/fa/c1db4a19fc3d277371bc43db96cd01794bdf39dbb99c5a50a2b0678da1c5/log_signatures_pytorch-0.1.11-py3-none-any.whl#sha256=86f38e0b9453a9ac02e818a4f49b8aaf5020f7f790318504515550d0ef726921"
    backends:
      - name: cpu
        env:
          OMP_NUM_THREADS: "{cpu_count}"
          MKL_NUM_THREADS: "{cpu_count}"
      - name: gpu
    operations:
      - signature
      - logsignature
      - sig_backprop
      - logsignature_backprop

  signatory:
    type: python
    memory_framework: torch
    script: "adapters/python/run_signatory.py"
    extras:
      - signatory
    backends:
      - name: cpu
        env:
          OMP_NUM_THREADS: "{cpu_count}"
          MKL_NUM_THREADS: "{cpu_count}"
      - name: gpu
    operations:
      - signature
      - logsignature
      - sig_backprop
      - logsignature_backprop

  pathsig:
    type: python
    memory_framework: torch
    script: "adapters/python/run_pathsig.py"
    extras:
      - pathsig
    backend: gpu
    env:
      CMAKE_ARGS: "-DCUDA_nvrtc_LIBRARY={repo_root}/.venv/lib/python3.12/site-packages/nvidia/cu13/lib/libnvrtc.so.13"
      TORCH_CUDA_ARCH_LIST: "12.0"
      # Avoid the NVCC/GCC 15 dependent-type error in PyTorch's C++17 headers.
      NVCC_APPEND_FLAGS: "--std=c++20"
    operations:
      - signature
      - logsignature
      - sig_backprop
      - logsignature_backprop

  pysiglib:
    type: python
    memory_framework: torch
    script: "adapters/python/run_pysiglib.py"
    extras:
      - pysiglib
    backends:
      - name: cpu
      - name: gpu
    operations:
      - signature
      - logsignature
      - sig_backprop
      - logsignature_backprop
      - branchedsignature_nonplanar
      - branchedsignature_planar
      - branchedsignature_nonplanar_backprop
      - branchedsignature_planar_backprop
      - branchedlogsignature_nonplanar
      - branchedlogsignature_planar
      - branchedlogsignature_nonplanar_backprop
      - branchedlogsignature_planar_backprop
      - signaturekernel_fwd_bwd

  polysigkernel:
    type: python
    memory_framework: jax
    script: "adapters/python/run_polysigkernel.py"
    extras:
      - polysigkernel
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_FLAGS: "--xla_cpu_multi_thread_eigen=true intra_op_parallelism_threads={cpu_count}"
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signaturekernel_fwd_bwd

  sigkerax:
    type: python
    memory_framework: jax
    script: "adapters/python/run_sigkerax.py"
    extras:
      - sigkerax
    # Install the final Sigkerax release without its obsolete JAX <0.5 pin;
    # the adapter supplies compatibility for the current locked JAX API.
    compatibility_wheel:
      url: "https://files.pythonhosted.org/packages/b7/30/f85c02264a9d38c00a98285f249530f5046a714c7a31e13a8b2cd142b778/sigkerax-0.2.1-py3-none-any.whl#sha256=3c9a567019247b5d783d8d2b0b9588efb4f5a64bd7a52bf277c1a9b9170daa2c"
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_FLAGS: "--xla_cpu_multi_thread_eigen=true intra_op_parallelism_threads={cpu_count}"
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signaturekernel_fwd_bwd

  sigkernel:
    type: python
    memory_framework: torch
    script: "adapters/python/run_sigkernel.py"
    extras:
      - sigkernel
    backends:
      - name: cpu
      - name: gpu
        env:
          NUMBA_CUDA_DRIVER: "/usr/lib/wsl/lib/libcuda.so.1"
    operations:
      - signaturekernel_fwd_bwd

  stochastax:
    type: python
    memory_framework: jax
    script: "adapters/python/run_stochastax.py"
    extras:
      - stochastax
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_FLAGS: "--xla_cpu_multi_thread_eigen=true intra_op_parallelism_threads={cpu_count}"
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - branchedsignature_nonplanar
      - branchedsignature_planar
      - branchedsignature_nonplanar_backprop
      - branchedsignature_planar_backprop
      - branchedlogsignature_nonplanar
      - branchedlogsignature_planar
      - branchedlogsignature_nonplanar_backprop
      - branchedlogsignature_planar_backprop

  signax:
    type: python
    memory_framework: jax
    script: "adapters/python/run_signax.py"
    extras:
      - signax
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_FLAGS: "--xla_cpu_multi_thread_eigen=true intra_op_parallelism_threads={cpu_count}"
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signature
      - logsignature
      - sig_backprop
      - logsignature_backprop

  tensordev:
    type: python
    memory_framework: jax
    script: "adapters/python/run_tensordev.py"
    extras:
      - tensordev
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_FLAGS: "--xla_cpu_multi_thread_eigen=true intra_op_parallelism_threads={cpu_count}"
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signature
      - logsignature
      - sig_backprop
      - logsignature_backprop

  keras_sig:
    type: python
    memory_framework: jax
    script: "adapters/python/run_keras_sig.py"
    extras:
      - keras-sig
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
          XLA_FLAGS: "--xla_cpu_multi_thread_eigen=true intra_op_parallelism_threads={cpu_count}"
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signature
      - sig_backprop

  chen-signatures:
    type: python
    script: "adapters/python/run_chen.py"
    extras:
      - chen-signatures
    backend: cpu
    operations:
      - signature
      - logsignature
      - sig_backprop

  # ChenSignatures.jl:
  #   type: julia
  #   dir: "adapters/julia"
  #   script: "run_chen.jl"
  #   operations:
  #     - signature
  #     - logsignature
