# libraries_registry.yaml
# Registry of adapters and their dependencies

libraries:
  iisignature:
    type: python
    script: "adapters/python/run_iisignature.py"
    extras:
      - iisignature
    backend: cpu
    operations:
      - signature
      - logsignature

  roughpy:
    type: python
    script: "adapters/python/run_roughpy.py"
    extras:
      - roughpy
    backend: cpu
    operations:
      - signature
      - logsignature

  signature-rs:
    type: python
    script: "adapters/python/run_signature_rs.py"
    extras:
      - signature-rs
    backend: cpu
    operations:
      - logsignature

  log-signatures-pytorch:
    type: python
    script: "adapters/python/run_log_signatures_pytorch.py"
    extras:
      - log-signatures-pytorch
    # This pure-Python wheel works on 3.12, but its metadata declares >=3.13.
    # The orchestrator installs only this exact verified wheel while ignoring
    # that marker.
    compatibility_wheel:
      url: "https://files.pythonhosted.org/packages/b1/fa/c1db4a19fc3d277371bc43db96cd01794bdf39dbb99c5a50a2b0678da1c5/log_signatures_pytorch-0.1.11-py3-none-any.whl#sha256=86f38e0b9453a9ac02e818a4f49b8aaf5020f7f790318504515550d0ef726921"
    backends:
      - name: cpu
      - name: gpu
    operations:
      - signature
      - logsignature
      - sigdiff

  pathsig:
    type: python
    script: "adapters/python/run_pathsig.py"
    extras:
      - pathsig
    backend: gpu
    env:
      CMAKE_ARGS: "-DCUDA_nvrtc_LIBRARY={repo_root}/.venv/lib/python3.12/site-packages/nvidia/cu13/lib/libnvrtc.so.13"
      TORCH_CUDA_ARCH_LIST: "12.0"
    operations:
      - signature
      - logsignature
      - sigdiff

  pysiglib:
    type: python
    script: "adapters/python/run_pysiglib.py"
    extras:
      - pysiglib
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signature
      - logsignature
      - sigdiff
      - branchedsignature_nonplanar
      - branchedsignature_planar
      - signaturekernel

  polysigkernel:
    type: python
    script: "adapters/python/run_polysigkernel.py"
    extras:
      - polysigkernel
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signaturekernel

  stochastax:
    type: python
    script: "adapters/python/run_stochastax.py"
    extras:
      - stochastax
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signature
      - logsignature
      - sigdiff
      - branchedsignature_nonplanar
      - branchedsignature_planar

  signax:
    type: python
    script: "adapters/python/run_signax.py"
    extras:
      - signax
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signature
      - logsignature
      - sigdiff

  keras_sig:
    type: python
    script: "adapters/python/run_keras_sig.py"
    extras:
      - keras-sig
    backends:
      - name: cpu
        env:
          JAX_PLATFORM_NAME: cpu
      - name: gpu
        env:
          JAX_PLATFORM_NAME: gpu
    operations:
      - signature
      - sigdiff

  chen-signatures:
    type: python
    script: "adapters/python/run_chen.py"
    extras:
      - chen-signatures
    backend: cpu
    operations:
      - signature
      - logsignature
      - sigdiff

  # ChenSignatures.jl:
  #   type: julia
  #   dir: "adapters/julia"
  #   script: "run_chen.jl"
  #   operations:
  #     - signature
  #     - logsignature
