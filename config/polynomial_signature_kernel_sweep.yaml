# Polynomial signature-kernel sweep.

libraries:
    - pysiglib
    - polysigkernel

path_kind: "brownian"
seed: 20260529

Ns: [200, 400, 800]
Ds: [2, 4, 8, 16]
Ms: [3]

operations:
    - signaturekernel_fwd_bwd

backends:
    - cpu
    - gpu

batch_size: 32
repeats: 10

sig_kernel_method: "polynomial"
sig_kernel_order: 3
sig_kernel_solver: "monomial_approx"
sig_kernel_max_batch: -1

library_configs:
    polysigkernel:
        sig_kernel_order: 3
        dtype: "float32"
    pysiglib:
        sig_kernel_method: "polynomial"
        sig_kernel_order: 3
        dtype: "float32"

runs_dir: "runs"
