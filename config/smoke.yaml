# Smoke test configuration - minimal, fast benchmark for CI/CD
# Expected runtime: < 5 seconds

path_kind: "sin"
seed: 0

# Minimal parameter sweep
Ns: [50]
Ds: [2]
Ms: [2]

# Only test signature operation (fastest)
operations:
  - signature

backends:
  - cpu

# Minimal repeats for speed
batch_size: 1
repeats: 3

# Output directory
runs_dir: "runs"
