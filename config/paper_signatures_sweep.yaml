# Forward and backward signature sweep for the pySigLib paper.

libraries:
    - iisignature
    - roughpy
    - log-signatures-pytorch
    - signatory
    - pathsig
    - pysiglib
    - stochastax
    - signax
    - tensordev
    - keras_sig
    - chen-signatures

path_kind: "brownian"
seed: 20260529

Ns: [10000]
Ds: [2, 4, 8, 16]
Ms: [2, 3]

operations:
    - signature
    - sig_backprop

backends:
    - cpu
    - gpu

batch_size: 256
repeats: 3
warmup_iterations: 1
timing_statistic: "min"
worker_memory_limit_gb: 16
clear_input_caches_after_task: true

library_configs:
    pysiglib:
        backend_configs:
            cpu:
                n_jobs: -1

runs_dir: "runs"
