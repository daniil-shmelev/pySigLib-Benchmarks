# Forward and backward signature sweep for the pySigLib paper.

libraries:
    - iisignature
    - log-signatures-pytorch
    - signatory
    - pathsig
    - pysiglib
    - stochastax
    - signax
    - tensordev
    - keras_sig

path_kind: "brownian"
seed: 20260529

Ns: [10000]
Ds: [2, 4, 8, 16]
Ms: [2, 3]

operations:
    - signature
    - sig_backprop

backends:
    - cpu
    - gpu

batch_size: 256
repeats: 3
warmup_iterations: 1
timing_statistic: "min"
clear_input_caches_after_task: true

runs_dir: "runs"
