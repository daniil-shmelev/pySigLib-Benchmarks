# combined_sweep.yaml
# Conservative all-operation sweep across finite-difference-compatible libraries.
#
# Signature kernels scale quadratically in both path length and batch size, so
# this combined run uses the kernel sweep's smaller grid. Use benchmark_sweep.yaml
# for the larger signature-only grid.

libraries:
    - iisignature
    - signature-rs
    - log-signatures-pytorch
    - signatory
    - pathsig
    - pysiglib
    - sigkerax
    - sigkernel
    - signax
    - tensordev
    - keras_sig
    - chen-signatures

path_kind: "brownian"
seed: 20260529

Ns: [200, 400, 800]
Ds: [2, 4, 8, 16]

# Signature-kernel adapters retain this placeholder in the common results schema.
Ms: [3]

operations:
    - signature
    - logsignature
    - sig_backprop
    - logsignature_backprop
    - branchedsignature_nonplanar
    - branchedsignature_nonplanar_backprop
    - branchedlogsignature_nonplanar
    - branchedlogsignature_nonplanar_backprop
    - branchedsignature_planar
    - branchedsignature_planar_backprop
    - branchedlogsignature_planar
    - branchedlogsignature_planar_backprop
    - signaturekernel
    - signaturekernel_backprop

backends:
    - cpu
    - gpu

batch_size: 32
repeats: 10

logsig_method: "S"

sig_kernel_method: "finite_difference"
sig_kernel_max_batch: -1

library_configs:
    sigkerax:
        sig_kernel_refinement_factor: 1
        backend_configs:
            cpu:
                dtype: "float64"
            gpu:
                dtype: "float32"
    sigkernel:
        sig_kernel_dyadic_order: 0
        sig_kernel_max_batch: 4
        backend_configs:
            cpu:
                dtype: "float64"
            gpu:
                dtype: "float32"
    pysiglib:
        sig_kernel_method: "finite_difference"
        sig_kernel_dyadic_order: 0
        sig_kernel_max_batch: 4
        backend_configs:
            cpu:
                dtype: "float64"
            gpu:
                dtype: "float32"

runs_dir: "runs"
