# Signature-kernel sweep for the pySigLib paper.

libraries:
    - pysiglib
    - sigkerax
    - sigkernel

path_kind: "brownian"
seed: 20260529

Ns: [1000]
Ds: [2, 4, 8, 16]
Ms: [3]

operations:
    - signaturekernel
    - signaturekernel_backprop

backends:
    - cpu
    - gpu

batch_size: 32
repeats: 10
warmup_iterations: 1
timing_statistic: "min"
worker_memory_limit_gb: 16
clear_input_caches_after_task: true

sig_kernel_method: "finite_difference"
sig_kernel_max_batch: -1

library_configs:
    sigkerax:
        sig_kernel_refinement_factor: 1
        backend_configs:
            cpu:
                dtype: "float64"
            gpu:
                dtype: "float32"
    # CUDA supports fewer than 1024 refined path intervals in sigkernel.
    sigkernel:
        sig_kernel_dyadic_order: 0
        sig_kernel_max_batch: 4
        backend_configs:
            cpu:
                dtype: "float64"
            gpu:
                dtype: "float32"
    pysiglib:
        sig_kernel_method: "finite_difference"
        sig_kernel_dyadic_order: 0
        sig_kernel_max_batch: 4
        backend_configs:
            cpu:
                dtype: "float64"
                n_jobs: -1
            gpu:
                dtype: "float32"

runs_dir: "runs"
